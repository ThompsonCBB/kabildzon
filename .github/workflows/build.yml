name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode binary assets (if any)
        run: bash .github/decode-assets.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.8"
      - name: Build
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: kabildzon
          path: build/libs/*.jar
